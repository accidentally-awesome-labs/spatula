packages:
  - 'packages/*'
  - 'apps/*'
  - 'platform/*'
  - 'packs/*'

allowBuilds:
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  workerd: true

overrides:
  '@grpc/grpc-js': 1.14.4
  '@opentelemetry/core': 2.9.0
  '@opentelemetry/sdk-node': 0.220.0
  '@protobufjs/utf8': 1.1.1
  axios: 1.16.0
  brace-expansion: 5.0.6
  esbuild: 0.28.1
  fast-xml-builder: 1.1.7
  fast-xml-parser: 5.7.0
  flatted: 3.4.2
  follow-redirects: 1.16.0
  form-data: 4.0.6
  hono: 4.12.29
  js-yaml: 4.3.0
  lodash: 4.18.0
  picomatch: 4.0.4
  postcss: 8.5.18
  protobufjs: 7.6.3
  undici: 7.28.0
  uuid: 11.1.1
  vite: 6.4.3
  ws: 8.21.0
  # Miniflare and Wrangler pin the versions they're tested with, which are newer than the pins above.
  'miniflare>undici': 7.29.1
  'wrangler>esbuild': 0.28.2
  '@cloudflare/vitest-plugin>esbuild': 0.28.2
